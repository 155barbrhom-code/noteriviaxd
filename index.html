<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر المراجعة</title>
<meta name="theme-color" content="#5b6fd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المراجعة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5fa;--cd:#fff;--ink:#1f2540;--mu:#6c7490;--ln:#e4e7f1;--ac:#5b6fd1;--ok:#2f9d8a;--bad:#d0584f;--gd:#c99a3e;--pu:#8068c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12162a;--cd:#1b2038;--ink:#e8eaf6;--mu:#9aa2c0;--ln:#2c3358;--ac:#97a6ee;--ok:#4fc2ae;--bad:#ee8279;--gd:#e3b867;--pu:#a994e6}}
:root[data-theme=dark]{--bg:#12162a;--cd:#1b2038;--ink:#e8eaf6;--mu:#9aa2c0;--ln:#2c3358;--ac:#97a6ee;--ok:#4fc2ae;--bad:#ee8279;--gd:#e3b867;--pu:#a994e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;max-width:640px;margin:auto;padding-bottom:96px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:22px;font-weight:700;line-height:1.4}
h2{font-size:16px;font-weight:700}
small{color:var(--mu);font-size:12.5px}
u{text-decoration:none;color:var(--bad);font-weight:600}
.pg{padding:16px 14px}
.ld,.em{color:var(--mu);text-align:center;padding:22px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-top:12px}
.sh{margin:20px 2px 0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gh{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:16px;width:100%}
.dt{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.bd{background:var(--c);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;font-weight:700}
.it{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,var(--cd));border-inline-start:4px solid var(--c);margin-top:8px}
.dn{padding:10px 20px;border-radius:10px;font-weight:700}
.bt{display:flex;gap:8px}
.bt button{flex:1;padding:11px;border-radius:12px;font-weight:700}
.ok{background:var(--c,var(--ac));color:#fff}
.no{border:1.5px solid var(--ln);color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:12px}
.l{height:42px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--c) 50%,var(--ln));background:color-mix(in srgb,var(--c) var(--p,0%),transparent);font-weight:600;position:relative}
.l.f{background:var(--c);color:#fff;border-color:var(--c)}
.l.at::after{content:"📝";position:absolute;top:0;inset-inline-end:3px;font-size:10px}
.add{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-size:26px;line-height:1;flex:none}
.sj{display:block;width:100%;text-align:start}
.tb{display:flex;gap:6px;background:var(--ln);border-radius:12px;padding:4px;margin-top:12px}
.tb button{flex:1;padding:7px;border-radius:9px;font-weight:600;color:var(--mu)}
.tb .on{background:var(--cd);color:var(--ink)}
.bk{color:var(--ac);font-weight:600;padding:2px 0 8px}
.sw{padding:3px 12px;border-radius:99px;border:1.5px solid var(--ln);font-size:13px;color:var(--mu)}
.tri{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tri .cd{text-align:center;padding:12px 6px}
.tri b{font-size:21px;display:block;line-height:1.3}
.sr{padding:9px 0;border-top:1px solid var(--ln)}
.hr{display:grid;grid-template-columns:112px 1fr 76px;gap:8px;align-items:center;margin-top:9px;font-size:13px}
.hb{height:9px;border-radius:9px;background:var(--ln);overflow:hidden}
.hb b{display:block;height:100%;background:var(--c,var(--ac));border-radius:9px}
.ds{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fr label{font-size:12.5px;color:var(--mu);display:grid;gap:4px}
select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%;font:inherit;color:inherit}
.l.wk{box-shadow:inset 0 -3px 0 var(--bad)}
.dg6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.sw:disabled{opacity:.4;cursor:default}
.dy{height:44px;border-radius:12px;border:1.5px solid var(--ln);background:color-mix(in srgb,var(--ac) var(--p,0%),var(--cd));font-weight:700}
.dy.hi{color:var(--bg)}
.dy.nx{border:1.5px dashed var(--ac)}
.dy.sel{border:2px solid var(--ink)}
.cl{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:center;line-height:1.2;margin:8px 0 14px}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.s2{position:relative}
.sb{width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--ln));display:grid;gap:2px}
.sb.on{background:color-mix(in srgb,var(--c) 16%,var(--cd));border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.x2{position:absolute;top:6px;inset-inline-end:8px;font-size:12px;color:var(--mu)}
.dc{padding:0;overflow:hidden}
.dc.td{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff}
.dh.a{background:linear-gradient(135deg,#3b4cca,#6a5acd)}
.dh.b{background:linear-gradient(135deg,#0f9d85,#2290c4)}
.dh.f{background:linear-gradient(135deg,#a98318,#d9792b)}
.dh small{color:#ffffffd0}
.tg2{background:#ffffff30;border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:700}
.hr2{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--ln);border-inline-start:4px solid var(--c);background:color-mix(in srgb,var(--c) 7%,var(--cd))}
.hr2>div{flex:1;display:grid;line-height:1.4}
.hn{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.ic{font-size:20px}
.dr{display:grid;gap:6px}
.bcs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bch{padding:8px 16px;border-radius:99px;border:1.5px solid var(--ln);font-weight:600}
.bch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.exb{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--ln);font-weight:700;margin-top:10px}
.exb i{width:24px;height:24px;border:2px solid var(--mu);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;line-height:1}
.exb.on{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok);color:var(--ok)}
.exb.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.l.xd::before{content:"✓";position:absolute;top:2px;inset-inline-start:4px;width:15px;height:15px;border-radius:50%;background:#fff;color:var(--ok);font-size:10px;font-weight:700;line-height:15px;text-align:center}
.dr.td{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 25%,transparent)}
.c2{display:inline-block;padding:2px 10px;margin:2px 0 2px 4px;border-radius:99px;font-size:13px;background:color-mix(in srgb,var(--c) 14%,var(--cd));border:1px solid color-mix(in srgb,var(--c) 45%,var(--ln))}
input{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.rd{width:auto}
.dp{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px;cursor:pointer}
.dp::after{content:"📅";font-size:14px}
.dp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.rw .dp{min-width:150px}
.fb{display:block;position:relative;overflow:hidden;text-align:center;flex:1;cursor:pointer}
.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative}
.phb{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--ln);background:var(--bg)}
.ph img{display:block;width:88px;height:88px;object-fit:cover}
.x3{position:absolute;top:4px;inset-inline-end:4px;background:#000a;color:#fff;border-radius:99px;min-width:22px;height:22px;font-size:12px;line-height:22px;padding:0 6px}
.x3.cf{background:var(--bad)}
.er{width:100%;text-align:start}
.er span{display:block;min-width:0}
.er .pv2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.er.mt{opacity:.55}
.pb{padding:11px 16px;border-radius:12px;font-weight:700}
.f1{font-size:12.5px;color:var(--mu);display:grid;gap:4px;margin-top:12px}
.pv{margin:10px 0;font-size:13px;color:var(--mu)}
.ck{display:flex;gap:8px;align-items:center}
textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;font:inherit;color:inherit;resize:vertical;line-height:1.7;margin-top:8px}
.lks{display:grid;gap:6px;margin-top:8px}
.lk{color:var(--ac);text-decoration:none;word-break:break-all;font-size:14px}
#nv{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:flex;gap:4px;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nv button{flex:1;padding:6px 2px;border-radius:12px;font-size:11px;color:var(--mu);display:grid;justify-items:center}
#nv button.on{color:var(--ac);font-weight:700;background:color-mix(in srgb,var(--ac) 12%,transparent)}
#sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sh:empty{display:none}
.sd{background:var(--cd);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none;left:14px;right:14px;max-width:420px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:30}
#t[hidden]{display:none}
#t button{color:inherit;text-decoration:underline;font-weight:700;pointer-events:auto;padding:6px 10px}

/* ===== تحسينات الواجهة ===== */
h1{font-size:24px}
.pg{padding:20px 16px}
.cd{border-radius:20px;box-shadow:0 1px 2px rgba(25,40,70,.04),0 6px 18px rgba(25,40,70,.05)}
.it{border-radius:14px}
.tri b{font-size:26px}
.sc{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 16px;margin-top:12px;min-height:80px;border-radius:20px;background:var(--cd);border:1px solid var(--ln);border-inline-start:6px solid var(--c);box-shadow:0 1px 2px rgba(25,40,70,.04),0 6px 18px rgba(25,40,70,.05);transition:transform .12s}
.sc:active{transform:scale(.985)}
.si{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,var(--cd));display:grid;place-items:center;font-size:23px;flex:none}
.sn{flex:1;display:grid;font-size:18px;font-weight:700;line-height:1.4;min-width:0}
.sn small{font-weight:400;font-size:12.5px}
.cn{min-width:46px;height:46px;padding:0 10px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.cn.z{background:color-mix(in srgb,var(--c) 12%,var(--cd));color:var(--mu)}
.ch{color:var(--mu);font-size:26px;line-height:1;flex:none}
#nv button{line-height:1.25;text-align:center}

.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ti{display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--c) 20%,var(--cd));flex:none}
.tl{position:relative;display:grid;align-content:space-between;gap:12px;text-align:start;min-height:136px;padding:16px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,var(--cd)),var(--cd) 78%);border:1px solid color-mix(in srgb,var(--c) 32%,var(--ln));box-shadow:0 1px 2px rgba(25,40,70,.04),0 6px 18px rgba(25,40,70,.05);transition:transform .12s}
.tl:active{transform:scale(.98)}
.tl:last-child:nth-child(odd){grid-column:1/-1;min-height:104px}
.tl .ti{width:50px;height:50px;font-size:27px}
.tl b{display:block;font-size:17px;line-height:1.35}
.tl .pill{position:absolute;top:14px;inset-inline-end:14px}
.pill{padding:2px 10px;border-radius:99px;background:var(--c);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;margin-top:4px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--cd)),color-mix(in srgb,var(--c) 6%,var(--cd)));border:1px solid color-mix(in srgb,var(--c) 28%,var(--ln))}
.hero .ti{width:58px;height:58px;font-size:30px;background:color-mix(in srgb,var(--c) 18%,var(--cd))}
.hero h1{font-size:22px}
.pgc{display:inline-block;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,var(--cd));border:1px solid color-mix(in srgb,var(--c) 40%,var(--ln))}
.ec{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.sc .si{font-size:22px}
/* ===== الدراسة والإحصاء والأقسام ===== */
.g.en{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.l.en{height:56px;display:grid;align-content:center;justify-items:center;line-height:1.2;padding:0}
.l.en b{font-size:17px}
.l.en small{font-size:10px;color:inherit;opacity:.8}
.tl.sm{min-height:112px}
.dayc{padding:14px 12px 12px}
.dayh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayh small{display:block;text-align:center}
.dn2{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);font-size:26px;line-height:1;color:var(--ac)}
.dn2:disabled{opacity:.35;cursor:default}
.dayn{display:block;font-size:36px;font-weight:700;line-height:1.1;color:var(--ac);font-variant-numeric:tabular-nums;text-align:center}
.ds2{position:relative;display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px;margin-top:6px;scrollbar-width:none}
.ds2::-webkit-scrollbar{display:none}
.dy{flex:none;width:42px;height:42px;border-radius:12px;font-size:14px}
.jmp{display:flex;gap:8px;margin-top:8px}
.jmp input{flex:1;min-width:0}
.jmp .ok{background:var(--ac);color:var(--bg);flex:none;padding:9px 18px}
.stc{text-align:center;padding:18px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--cd)),var(--cd) 60%)}
.rgw{position:relative;width:196px;height:196px;margin:0 auto}
.rgw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:color-mix(in srgb,var(--c) 18%,var(--ln));stroke-width:10}
.rf{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rc2{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.cl2{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.15}
.stt{font-weight:700;color:var(--mu)}
.stt.on{color:var(--c)}
.sh2{text-align:start;margin-top:18px;font-size:15px}
.sp .s2:last-child:nth-child(odd){grid-column:1/-1}
.sb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--c) 28%,var(--ln));background:var(--cd);min-height:58px}
.sb.on{background:color-mix(in srgb,var(--c) 15%,var(--cd));border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.bi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 16%,var(--cd));flex:none}
.bn{display:grid;line-height:1.3;min-width:0}
.bn b{font-size:14.5px}
.go{flex:2;padding:15px;font-size:17px;border-radius:16px;background:var(--c,var(--ac))}
.cmw{position:relative;height:196px;margin-top:12px;direction:ltr}
.gl{position:absolute;left:36px;right:0;height:1px;background:var(--ln)}
.yl{position:absolute;left:0;width:32px;text-align:end;font-size:10.5px;color:var(--mu);transform:translateY(50%)}
.cmp{position:absolute;left:38px;right:0;top:0;bottom:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.cc{flex:none;width:44px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:12px}
.cc.on{background:color-mix(in srgb,var(--ac) 9%,transparent)}
.cv{font-size:10.5px;color:var(--mu);height:16px;line-height:16px;font-variant-numeric:tabular-nums}
.cb{width:26px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 50%,var(--cd)));transition:height .2s}
.cb.z{background:var(--ln)}
.cx{height:26px;line-height:26px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.cc.on .cb{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 28%,transparent)}
.cc.on .cx,.cc.on .cv{color:var(--ink);font-weight:700}
.cc.cr .cx{color:var(--ac);font-weight:700}
.cdt{margin-top:12px;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--ln)}
/* ===== بطاقات إحصاء المواد ===== */
.hero.tot{margin-top:14px}
.hero.tot h1{font-size:26px;font-variant-numeric:tabular-nums}
.tl .tm{font-size:20px;color:var(--c);margin-top:2px;font-variant-numeric:tabular-nums}
.sbar{display:block;height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--ln));overflow:hidden}
.sbar u{display:block;height:100%;border-radius:99px;background:var(--c);text-decoration:none}
.tl:not(button){cursor:default}

input[type=range]{border:0;background:none;padding:0}
.cpt{display:grid;gap:4px;margin-top:6px}.cpt small{font-size:12px}
.stars{display:flex;gap:2px}.stars button{font-size:28px;line-height:1;color:var(--ln);padding:0 2px}.stars .on{color:var(--gd)}
.wh{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--pu));margin:12px 0 4px}.wh h1{font-size:24px}.wh small{color:#ffffffd0}.wt{text-align:center}.wt b{font-size:30px;display:block;line-height:1.1}
